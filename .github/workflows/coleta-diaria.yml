# Robô de coleta do app de acompanhamento (Instagram e Facebook de cada cliente,
# gravado no cofre criptografado):
#   - 23h de Brasília (02h UTC): coleta completa (ontem + hoje).
#   - a cada 15 min: coleta rápida (só hoje), para o app ter movimento no dia.
# O GitHub atrasa ou pula agendamentos curtos; por isso o PC do Vitor também
# dispara a rápida a cada 15 min (tarefa do Windows "Studio - Coleta rapida",
# que roda  gh workflow run coleta-diaria.yml -f modo=rapida).
# Na mão: Actions > Coleta diária > Run workflow.
name: Coleta diária

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      modo:
        description: "completa (ontem + hoje) ou rapida (só hoje)"
        default: completa

permissions:
  contents: write

concurrency:
  group: escrita-no-repositorio
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cryptography
      - name: Coletar e fechar os cofres
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_STUDIO: ${{ secrets.IG_STUDIO }}
          FB_STUDIO: ${{ secrets.FB_STUDIO }}
          SENHA_STUDIO: ${{ secrets.SENHA_STUDIO }}
          ACESSOS_STUDIO: ${{ secrets.ACESSOS_STUDIO }}
          IG_MORANGUINHO: ${{ secrets.IG_MORANGUINHO }}
          FB_MORANGUINHO: ${{ secrets.FB_MORANGUINHO }}
          SENHA_MORANGUINHO: ${{ secrets.SENHA_MORANGUINHO }}
        # Um cliente novo = mais uma linha de segredos acima e o id na lista abaixo
        run: |
          if [ "${{ github.event.schedule }}" = "0 2 * * *" ] || [ "${{ inputs.modo }}" = "completa" ]; then
            python robo.py studio moranguinho
          else
            python robo.py --hoje studio moranguinho
          fi
      - name: Gravar no repositório
        run: |
          git config user.name "robo-marketing-essencial"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/*.enc.json
          git diff --cached --quiet || git commit -m "Coleta $(TZ=America/Sao_Paulo date '+%F %H:%M')"
          git pull --rebase && git push
